version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: "uv"
    directory: "/"
