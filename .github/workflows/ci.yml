name: CI

on:
  push:
    paths:
      - "gps/**"
      - "wingfoil/**"
  pull_request:
    paths:
      - "gps/**"
      - "wingfoil/**"

jobs:
  test-py314:
    name: Test ${{ matrix.server }} (Python 3.14)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server: [gps, wingfoil]
    defaults:
      run:
        working-directory: ${{ matrix.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync --dev
      - run: uv run pytest tests/ --cov=. --cov-fail-under=100
      - run: uv run pre-commit run --all-files

  healthcheck:
    name: Docker health check
    runs-on: ubuntu-latest
    needs: [test-py314]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - run: sleep 5
      - run: |
          for port in 8101 8102; do
            echo "Checking localhost:$port ..."
            curl -sf http://localhost:$port/ || { echo "FAIL on port $port"; docker compose logs; exit 1; }
          done
      - run: docker compose down

  test-py315:
    name: Test ${{ matrix.server }} (Python 3.15 — allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        server: [gps, wingfoil]
    defaults:
      run:
        working-directory: ${{ matrix.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
      - run: uv sync --dev
      - run: uv run pytest tests/ --cov=. --cov-fail-under=100
