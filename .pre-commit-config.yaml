repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=2000']
      - id: check-merge-conflict

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: ^(.*\.lock|.*\.example)$

  - repo: local
    hooks:
      - id: glossary-check
        name: glossary.md exists and is sorted
        entry: bash -c 'test -f glossary.md || { echo "glossary.md missing — create it per AGENTS.md"; exit 1; } && tail -n +5 glossary.md | grep "^|" | grep -v "^| Term" | grep -v "^|---" | awk -F"|" "{print \$2}" | sed "s/^ *\*\*//;s/\*\* *$//" | sort -fc || { echo "glossary.md terms are not sorted alphabetically"; exit 1; }'
        language: system
        pass_filenames: false
        always_run: true

      - id: vulture
        name: vulture (dead code)
        entry: vulture
        language: system
        types: [python]
        pass_filenames: false
        args: [gps, wingfoil, --min-confidence, "80", --exclude, "*/.venv/*"]
